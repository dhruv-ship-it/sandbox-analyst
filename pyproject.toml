[project]
name = "sandbox-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhruv Ranjan", email = "irldhruv196@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
    "live: tests that call real external services (Modal, network). Excluded by default.",
]
addopts = "-m \"not live\""

